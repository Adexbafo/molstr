name: molstr
description: "MolStr - Privacy-focused decentralized Nostr client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  http: ^1.3.0
  web_socket_channel: ^3.0.1
  qr_flutter: ^4.1.0
  flutter_svg: ^2.5.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0F0A1E"
  windows: true
  macos: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo/molstr_icon.svg