name: molstr
description: "MolStr - Privacy-focused decentralized Nostr client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.6
  http: ^1.3.0
  web_socket_channel: ^3.0.1
  qr_flutter: ^4.1.0
  flutter_svg: ^2.5.0
  url_launcher: ^6.3.3
  bip340: ^0.3.1
  crypto: ^3.0.8
  file_picker: ^11.0.3
  ndk: ^0.10.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4



flutter:
  uses-material-design: true

  assets:
    - assets/logo/molstr_icon.svg

  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700

    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "branding/launcher_rounded.png"
  image_path_ios: "branding/launcher_square.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "branding/launcher_foreground.png"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
    image_path: "branding/launcher_macos.png"